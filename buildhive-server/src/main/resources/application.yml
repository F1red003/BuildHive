server:
  port: 8080

spring:
  application:
    name: buildhive-server
  mvc:
    async:
      # Let the 30-minute log stream finish before the servlet times it out.
      request-timeout: 31m

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/buildhive}
    username: ${SPRING_DATASOURCE_USERNAME:buildhive}
    password: ${SPRING_DATASOURCE_PASSWORD:buildhive}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: true
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

buildhive:
  storage:
    root-path: ${BUILDHIVE_STORAGE_ROOT:./buildhive-data}
  scheduler:
    lease-duration-seconds: 60
    reaper-interval-ms: 15000
    heartbeat-timeout-seconds: 30
